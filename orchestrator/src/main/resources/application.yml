spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: conversation-state-consumer
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/agent_platform
    username: agent
    password: agent

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: openai/gpt-oss-20b

order-service:
  base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:5001}


management:
  endpoints:
    web:
      exposure:
        include: env, configprops
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.name: va-orchestrator
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

voice:
  public-host: ${VOICE_PUBLIC_HOST:pasty-washout-supermom.ngrok-free.dev}

deepgram:
  api-key: ${DEEPGRAM_API_KEY}