<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VA — Order Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #10121a;
          --surface: #191c27;
          --surface-2: #212536;
          --accent: #e8a33d;
          --accent-soft: rgba(232, 163, 61, 0.14);
          --user-bubble: #2a3350;
          --text: #eceef3;
          --text-muted: #8b90a6;
          --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
          height: 100%;
          margin: 0;
          background: var(--bg);
          color: var(--text);
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        body {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
        }

        @media (prefers-reduced-motion: reduce) {
          * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        .widget {
          width: 100%;
          max-width: 420px;
          height: 640px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 20px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
          opacity: 0;
          transform: translateY(12px);
          animation: widgetIn 0.5s ease-out forwards;
        }

        @keyframes widgetIn {
          to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
          padding: 18px 20px 14px;
          border-bottom: 1px solid var(--border);
          background: var(--surface);
        }

        .header-top {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .mark {
          width: 34px;
          height: 34px;
          border-radius: 9px;
          background: var(--accent-soft);
          color: var(--accent);
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          font-size: 14px;
          letter-spacing: 0.02em;
          flex-shrink: 0;
        }

        .header-text {
          flex: 1;
          min-width: 0;
        }

        .header-title {
          font-size: 15px;
          font-weight: 600;
          line-height: 1.2;
        }

        .header-status {
          font-size: 12.5px;
          color: var(--text-muted);
          display: flex;
          align-items: center;
          gap: 6px;
          margin-top: 2px;
        }

        .pulse-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #4ade80;
          position: relative;
          flex-shrink: 0;
        }

        .pulse-dot::after {
          content: '';
          position: absolute;
          inset: -3px;
          border-radius: 50%;
          background: #4ade80;
          opacity: 0.35;
          animation: pulseRing 2s ease-out infinite;
        }

        @keyframes pulseRing {
          0% { transform: scale(0.6); opacity: 0.4; }
          100% { transform: scale(2.2); opacity: 0; }
        }

        .barcode {
          display: flex;
          gap: 2px;
          margin-top: 14px;
          height: 10px;
          align-items: flex-end;
          opacity: 0.5;
        }

        .barcode span {
          width: 2px;
          background: var(--accent);
          border-radius: 1px;
        }

        /* Message list */
        .messages {
          flex: 1;
          overflow-y: auto;
          padding: 18px 16px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }

        .row {
          display: flex;
          animation: msgIn 0.28s ease-out;
        }

        @keyframes msgIn {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .row.user { justify-content: flex-end; }
        .row.agent { justify-content: flex-start; }

        .bubble {
          max-width: 78%;
          padding: 10px 14px;
          font-size: 14.5px;
          line-height: 1.45;
        }

        .row.agent .bubble {
          background: var(--surface-2);
          color: var(--text);
          border-radius: 4px 14px 14px 14px;
        }

        .row.user .bubble {
          background: var(--user-bubble);
          color: var(--text);
          border-radius: 14px 4px 14px 14px;
        }

        .typing .bubble {
          display: flex;
          gap: 4px;
          align-items: center;
          padding: 13px 14px;
        }

        .typing .dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: var(--text-muted);
          animation: typingBounce 1.1s ease-in-out infinite;
        }

        .typing .dot:nth-child(2) { animation-delay: 0.15s; }
        .typing .dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBounce {
          0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
          30% { transform: translateY(-3px); opacity: 1; }
        }

        /* Composer */
        .composer {
          display: flex;
          gap: 8px;
          padding: 14px 16px 16px;
          border-top: 1px solid var(--border);
          background: var(--surface);
        }

        .composer input {
          flex: 1;
          background: var(--surface-2);
          border: 1px solid var(--border);
          border-radius: 22px;
          padding: 11px 16px;
          color: var(--text);
          font-family: inherit;
          font-size: 14.5px;
          outline: none;
          transition: border-color 0.15s ease;
        }

        .composer input:focus {
          border-color: var(--accent);
        }

        .composer input::placeholder { color: var(--text-muted); }

        .send-btn {
          width: 42px;
          height: 42px;
          border-radius: 50%;
          border: none;
          background: var(--accent);
          color: #10121a;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          flex-shrink: 0;
          transition: transform 0.12s ease, opacity 0.12s ease;
        }

        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.96); }
        .send-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

        .send-btn:focus-visible,
        .composer input:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }
    </style>
</head>
<body>

<div class="widget">
    <div class="header">
        <div class="header-top">
            <div class="mark">VA</div>
            <div class="header-text">
                <div class="header-title">Order Support</div>
                <div class="header-status"><span class="pulse-dot"></span>Online now</div>
            </div>
        </div>
        <div class="barcode" id="barcode"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
        <input type="text" id="input" placeholder="Type a message…" autocomplete="off" />
        <button class="send-btn" id="sendBtn" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const API_BASE = ''; // same-origin — served from the Spring app itself
    const conversationId = crypto.randomUUID();
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    let knownTurnCount = 0;
    let pollTimer = null;

    // decorative barcode — random-width bars, purely visual
    const barcode = document.getElementById('barcode');
    for (let i = 0; i < 40; i++) {
      const bar = document.createElement('span');
      bar.style.height = (30 + Math.random() * 70) + '%';
      barcode.appendChild(bar);
    }

    function renderMessage(speaker, content) {
      const row = document.createElement('div');
      row.className = 'row ' + (speaker === 'user' ? 'user' : 'agent');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'row agent typing';
      row.id = 'typingRow';
      row.innerHTML = '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      const row = document.getElementById('typingRow');
      if (row) row.remove();
    }

    async function fetchTurns() {
      const res = await fetch(`${API_BASE}/api/conversations/${conversationId}/turns`);
      return res.json();
    }

    async function pollForReply() {
      let attempts = 0;
      pollTimer = setInterval(async () => {
        attempts++;
        const turns = await fetchTurns();
        if (turns.length > knownTurnCount) {
          clearInterval(pollTimer);
          hideTyping();
          for (let i = knownTurnCount; i < turns.length; i++) {
            renderMessage(turns[i].speaker, turns[i].content);
          }
          knownTurnCount = turns.length;
          setInputEnabled(true);
        }
        if (attempts > 30) { // ~30s timeout safety net
          clearInterval(pollTimer);
          hideTyping();
          setInputEnabled(true);
        }
      }, 1000);
    }

    function setInputEnabled(enabled) {
      inputEl.disabled = !enabled;
      sendBtn.disabled = !enabled;
      if (enabled) inputEl.focus();
    }

    async function sendMessage() {
      const content = inputEl.value.trim();
      if (!content) return;

      renderMessage('user', content);
      knownTurnCount++;
      inputEl.value = '';
      setInputEnabled(false);
      showTyping();

      await fetch(`${API_BASE}/api/conversations/${conversationId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });

      pollForReply();
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function startConversation() {
      setInputEnabled(false);
      const res = await fetch(`${API_BASE}/api/conversations/${conversationId}/start`, { method: 'POST' });
      const turns = await res.json();
      for (const turn of turns) {
        renderMessage(turn.speaker, turn.content);
      }
      knownTurnCount = turns.length;
      setInputEnabled(true);
    }

    startConversation();
</script>

</body>
</html>
